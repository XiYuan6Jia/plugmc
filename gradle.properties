# Gradle 运行参数
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Paper 属性（版本查询：https://fill.papermc.io/v3/projects/paper）
# 26.x 起 paper-api 按构建号发布，形如 26.3.build.229-stable
paper_minecraft_version=26.3
paper_api_version=26.3.build.229-stable
paper_build=229

# Fabric 属性（历史，版本查询：https://fabricmc.net/develop）
minecraft_version=26.3
loader_version=0.20.1
fabric_api_version=0.165.2+26.3

# 本环境提供的 Minecraft 26.3 / Fabric API 制品已是 Mojang 命名（未混淆），
# 关闭 Loom 的映射与重映射；若改用官方混淆制品，需删除本行并声明 mappings。
fabric.loom.disableObfuscation=true

# 插件属性（各插件可在自己的 build.gradle.kts 中覆盖 version）
version=0.1.0
group=com.xiyuan.plugmc

# 数据包格式版本（Minecraft 26.3 的 data pack format）
datapack_format=121
