name: probe
version: '${version}'
main: com.xiyuan.plugmc.probe.ProbePlugin
api-version: '${api_version}'
description: 测试服专用：以真实玩家身份派发命令/合成点击，用于没有键鼠注入通道时做端到端验证
commands:
  asplayer:
    description: 以指定玩家身份执行一条命令
    usage: /asplayer <玩家> <命令...>
    permission: probe.admin
  probeblock:
    description: 读一格方块的真实 id
    usage: /probeblock <世界> <x> <y> <z>
    permission: probe.admin
  asclick:
    description: 合成一次右键实体
    usage: /asclick <玩家> [实体类型]
    permission: probe.admin
  openinv:
    description: 打印玩家当前打开的界面标题
    usage: /openinv <玩家>
    permission: probe.admin
  invitems:
    description: 列出玩家当前界面里的每个物品（确认按摊主过滤是否生效）
    usage: /invitems <玩家>
    permission: probe.admin
  astp:
    description: 把玩家传送到某世界坐标（跨维度）
    usage: /astp <玩家> <世界> <x> <y> <z>
    permission: probe.admin
  asheal:
    description: 满血复活
    usage: /asheal <玩家>
    permission: probe.admin
  invclick:
    description: 在当前打开的界面里点一个格子
    usage: /invclick <玩家> <槽位>
    permission: probe.admin
  asbell:
    description: 以指定玩家身份合成一次敲钟
    usage: /asbell <玩家> <世界> <x> <y> <z>
    permission: probe.admin
  assneak:
    description: 让玩家进入/退出潜行（连接列车要 shift 右键）
    usage: /assneak <玩家> <true|false>
    permission: probe.admin
  traincarts:
    description: 列出附近矿车的 UUID 与坐标
    usage: /traincarts <玩家> [半径]
    permission: probe.admin
  ashand:
    description: 看玩家主手/副手物品，可顺便把指定物品摆到主手
    usage: /ashand <玩家> [物品] [数量]
    permission: probe.admin
  asrc:
    description: 合成一次手持物品右键空气（验证羊角吹奏）
    usage: /asrc <玩家>
    permission: probe.admin
  vischeck:
    description: 查看某玩家能否看到装饰实体（验证可见性模式）
    usage: /vischeck <穿戴者> [观察者]
    permission: probe.admin
permissions:
  probe.admin:
    description: 允许使用探针命令
    default: op
