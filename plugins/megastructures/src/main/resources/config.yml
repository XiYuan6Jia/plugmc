# 星际巨构（独立虚空维度 + 程序生成的超级巨构）
world:
  # 世界（维度）文件夹名，创建后不建议改名
  name: mega
  # 世界边界（方块直径），避免玩家飞出巨构区域
  border-size: 2000
  spawn:
    x: 0.5
    y: 172.0
    z: 240.5
    yaw: 180.0
    pitch: -8.0

teleport:
  # 进服时自动送进巨构维度
  join-auto: false

protect:
  deny-build: true
  deny-pvp: true
  deny-mob-spawn: true
  no-fall-damage: true
  # 掉出巨构（Y 低于该值）时拉回出生点
  rescue-void: true
  void-y: -20
  # 在巨构维度里死亡后在出生点重生
  respawn-in-mega: true

comfort:
  # 在巨构维度里允许飞行（mega.fly）
  flight: true
  # 固定午夜 + 夜视，方便观察发光的巨构
  night-vision: true
