# 星际巨构（独立虚空维度 + 程序生成的超级巨构）
config-version: 2
world:
  # datapacks/plugmc-mega 定义的维度键；高度 2048 格（Y -512 ~ 1535）
  key: "plugmc:mega"
  # 世界边界（方块直径），避免玩家飞出巨构区域
  border-size: 3000
  spawn:
    x: 0.5
    y: 420.0
    z: 380.5
    yaw: 180.0
    pitch: -8.0

teleport:
  # 进服时自动送进巨构维度
  join-auto: false

protect:
  deny-build: true
  deny-pvp: true
  deny-mob-spawn: true
  no-fall-damage: true
  # 掉出巨构（Y 低于该值）时拉回出生点；维度底部为 Y=-512
  rescue-void: true
  void-y: -460
  # 在巨构维度里死亡后在出生点重生
  respawn-in-mega: true

comfort:
  # 在巨构维度里允许飞行（mega.fly）
  flight: true
  # 固定午夜 + 夜视，方便观察发光的巨构
  night-vision: true
