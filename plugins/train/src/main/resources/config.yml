# 铁道列车
#
# 连接方式：手持拴绳 shift 右键第一台矿车，再 shift 右键第二台矿车。
# 解开方式：手持拴绳 shift 右键已连接的那节车厢。
# 车头必须是动力矿车，动力矿车只能挂在列车的一端；两端各一个就是双向列车。
# 自动驾驶靠车头那台动力矿车烧煤，跟普通矿车一样 —— 没燃料就不走。

enabled: true

limits:
  # 一节列车最多几节车厢
  max-cars: 12
  # 自动驾驶的调度间隔（tick）。1 = 每 tick 都调一次，最顺滑也最费
  tick-interval: 1
  # 车厢之间的间距（格）。车厢贴着铁轨走，间距太大会拉出缝隙
  car-spacing: 0.9              # 车厢间距（格），钳制 0.5 ~ 1.0
  # 创造模式下连接/解开不扣也不给拴绳
  free-in-creative: true
  # 每节动力矿车允许被插件补到多少燃料（0 表示完全不补，纯靠玩家自己加煤）
  max-fuel-per-cart: 0

speed:
  # 巡航速度，单位是格/tick。0.4 约等于每秒 8 格
  travel: 0.34
  # 进站时的最低速度，用来把车慢慢蹭到站台
  approach: 0.12
  # 距离站点还有多少格开始减速
  brake-distance: 14.0
  # 车头离站点这么近就认定「到站」并清零速度
  stop-radius: 1.1

station:
  # 新建站点时的默认停靠秒数，可以逐站用 /train station dwell 改
  default-dwell-seconds: 8

route:
  # 寻路时最多搜多少个铁轨方块，防止在大路网里卡住主线程
  max-search-blocks: 96

effects:
  # 用粒子把连接中的矿车之间的绳子画出来
  link-particles: true
