name: economy
version: '${version}'
main: com.xiyuan.plugmc.economy.EconomyPlugin
api-version: '${api_version}'
authors: [XiYuan6Jia]
description: "复式记账经济系统（钱包/账本/商店/市场/拍卖行/邮箱）"
commands:
  money:
    description: "查看余额"
    usage: /money [玩家]
    aliases: [balance, bal]
  baltop:
    description: "余额排行"
    usage: /baltop
    aliases: [balancetop, rich]
  pay:
    description: "向其他玩家转账"
    usage: /pay <玩家> <金额>
  eco:
    description: "管理玩家余额与经济数据"
    usage: /eco <give|take|set> <玩家> <金额> | /eco stats|doctor|selftest|audit|treasury|freeze|save|backup
  shop:
    description: "系统商店"
    usage: /shop [buy <商品> [数量] | sell [数量|all] | sellall | price [商品] | search <关键词> | reload]
    aliases: [store]
  market:
    description: "玩家市场"
    usage: /market [sell <单价> [数量|all] | buy <编号> [数量] | cancel <编号> | mine | search <关键词> | reload]
    aliases: [marketplace]
  mail:
    description: "邮箱"
    usage: /mail [claim <id|all>] | /mail give <玩家> <物品> <数量>
    aliases: [mailbox]
  order:
    description: "收购订单"
    usage: /order [create <单价> <数量|all> | fill <编号> [数量|all] | cancel <编号> | list | mine | search <关键词> | reload]
    aliases: [buyorder, orders]
  auction:
    description: "拍卖行"
    usage: /auction [create <起拍价> [一口价|-] [数量|all] | bid <编号> <金额> | buy <编号> | cancel <编号> | list | mine | search <关键词> | reload]
    aliases: [ah, auctions]
  trade:
    description: "直接交易"
    usage: /trade <玩家> | /trade accept <玩家>
  bank:
    description: "建材银行：存入建材换算额度，取出同类建材或抵扣商店消费"
    usage: /bank [deposit [数量|all] | depositall | withdraw <商品> [数量] | value <商品> | balance | reload]
    aliases: [matbank, jiancai]
    permission: economy.bank.use
  daily:
    description: "每日签到与在线奖励"
    usage: /daily [status|reload]
    aliases: [qiandao]
permissions:
  economy.balance.others:
    description: "查看其他玩家余额"
    default: op
  economy.balance.top:
    description: "查看余额排行"
    default: true
  economy.admin:
    description: "管理玩家余额"
    default: op
  economy.shop.use:
    description: "使用系统商店"
    default: true
  economy.shop.admin:
    description: "重载商店配置"
    default: op
  economy.market.use:
    description: "使用玩家市场"
    default: true
  economy.market.admin:
    description: "重载市场配置"
    default: op
  economy.mail.use:
    description: "使用邮箱"
    default: true
  economy.mail.admin:
    description: "给玩家邮箱投递物品（补偿/发放）"
    default: op
  economy.order.use:
    description: "使用收购订单"
    default: true
  economy.order.admin:
    description: "重载收购订单配置"
    default: op
  economy.auction.use:
    description: "使用拍卖行"
    default: true
  economy.auction.admin:
    description: "重载拍卖行配置"
    default: op
  economy.trade.use:
    description: "使用直接交易"
    default: true
  economy.reward.daily:
    description: "领取每日签到奖励"
    default: true
  economy.reward.admin:
    description: "重载奖励配置"
    default: op
  economy.bank.use:
    description: "使用建材银行"
    default: true
  economy.bank.admin:
    description: "重载建材银行配置"
    default: op
