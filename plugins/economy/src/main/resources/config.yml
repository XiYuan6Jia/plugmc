currency:
  name: 金币
  symbol: $
  decimal-places: 2
starting-balance: "100.00"
storage:
  snapshot-interval-seconds: 300
  backup-count: 14
shop:
  enabled: true
  daily-buy-limit: 256
  daily-sell-limit: 256
  allow-custom-items: false
  # 系统商店交易税：买卖都按成交总额收取 3%
  tax-rate: 0.03
pay:
  # /pay 转账税：从转账总额中扣除 3% 进入税收账户
  tax-rate: 0.03
market:
  enabled: true
  slots: 8
  duration-hours: 168
  listing-fee-rate: 0.01
  listing-fee-min: "5.00"
  tax-rate: 0.03
mail:
  capacity: 50
  expire-days: 30
orders:
  enabled: true
  slots: 8
  duration-hours: 168
  listing-fee-rate: 0.01
  listing-fee-min: "2.00"
  tax-rate: 0.03
auction:
  enabled: true
  slots: 5
  duration-hours: 48
  min-increment: "1.00"
  min-increment-rate: 0.05
  anti-snipe-seconds: 60
  max-extensions: 5
  listing-fee-rate: 0.02
  listing-fee-min: "10.00"
  tax-rate: 0.03
rewards:
  enabled: true
  daily:
    enabled: true
    base: "100.00"
    streak-bonus: "20.00"
    streak-max-days: 7
  playtime:
    enabled: true
    minutes: 10
    amount: "20.00"
    max-per-day: 6
