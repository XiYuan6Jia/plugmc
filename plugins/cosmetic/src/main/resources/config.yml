config-version: 1

# 装备外观：把任意物品挂到玩家身上的若干"装饰槽"里显示出来。
#
# 设计要点（改配置前请先读）：
#  1. 一名玩家只能有 1 个原版直接乘客（Entity#canAddPassenger 是 passengers.isEmpty()），
#     而 ride 插件已经在用这个位置。所以本插件的所有部位都**不**当乘客，
#     而是靠服务端每 tick 算坐标 + teleport + setTeleportDuration 让客户端插值。
#  2. 部位坐标是相对玩家的（forward / up / right，单位：格）。yaw 会自动跟随玩家朝向，
#     pitch 只影响头顶槽（跟随抬头低头）。
#  3. 槽内物品必须原样保存（ItemStack 字节序列化），装饰实体只拿 clone 渲染。

# 全局开关
enabled: true

# 同步器节奏
sync:
  # 每 tick 同步一次的部位数上限保护：超过这个数量的部位会降频
  # 1 = 每 tick 都同步（最平滑，开销最大）
  interval-ticks: 1
  # 玩家移动超过这个距离（格）就立刻同步一次，不等下一个周期
  move-threshold: 0.05
  # teleportDuration：客户端插值窗口（tick）。1 最跟手，3 更平滑但有延迟
  teleport-duration: 2
  # 只有当玩家周围这个半径（格）内有其他玩家时，才做完整的姿态更新
  # 单人游戏时降到最低开销；0 = 不做这个优化
  near-players-radius: 0

# 可见性
view:
  # 装饰实体的可见半径（格），超过就不下发实体数据包
  range: 48.0
  # true = 只有自己看得到自己的装饰；false = 其他玩家也能看到
  self-only: false

# 部位定义
# id      : 部位标识（命令与权限用，勿随意改）
# name    : 界面里显示的名字
# offset  : [forward, up, right] 相对玩家的偏移（格）
# scale   : 物品缩放
# rotation: [x, y, z] 绕自身轴旋转的角度（度），用来把物品正面对着外侧
# transform: ItemDisplayTransform，可选 NONE / GUI / GROUND / FIXED / HEAD /
#            FIRSTPERSON_LEFTHAND / FIRSTPERSON_RIGHTHAND / THIRDPERSON_LEFTHAND / THIRDPERSON_RIGHTHAND
# pitch-follow: true 时，玩家抬头低头也会带动这个槽（头顶槽用）
# spin    : 每秒自转度数（0 = 不转），让挂饰有点生气
# permission: 需要这个权限才能往这个槽放东西（留空 = 所有人可放）
slots:
  head:
    name: "&b头顶"
    offset: [0.0, 1.90, 0.0]
    scale: 0.72
    rotation: [0.0, 0.0, 0.0]
    transform: FIXED
    pitch-follow: true
    spin: 0
  shoulder:
    name: "&a肩侧"
    # 手臂外沿在 |right| = 0.47（护臂再厚 0.06）。right 必须留在 0.47 + scale/2 之外，
    # 否则整块东西会插进手臂里 —— 之前写 0.30 就是这么进去的。
    offset: [0.0, 1.28, 0.66]
    scale: 0.36
    rotation: [0.0, 0.0, -8.0]
    transform: FIXED
    pitch-follow: false
    spin: 0
  back:
    name: "&6背后"
    # 背甲（护甲层）后表面在 forward = -0.18 一带。整块东西半尺寸 0.30，
    # 所以中心必须退到 -0.48 之后才不贴着背甲；这里取 -0.62 留一点余量。
    offset: [-0.62, 1.12, 0.0]
    scale: 1.20
    rotation: [0.0, 180.0, 0.0]
    transform: FIXED
    pitch-follow: false
    spin: 0
  waist:
    name: "&e腰间"
    # 腰这一圈正好是胸甲（0.64~1.47）与护腿（到 0.76）盖住的位置，
    # 所以不能只调高度，必须挪到护甲外表面之外（body 正面 0.12 + 护甲 0.06 = 0.18），
    # 不然穿装备就被完全挡住。
    offset: [0.44, 0.88, 0.24]
    scale: 0.38
    rotation: [0.0, 0.0, 0.0]
    transform: FIXED
    pitch-follow: false
    spin: 0
  orbit:
    name: "&d环绕"
    offset: [0.0, 0.62, 0.0]
    scale: 0.34
    rotation: [0.0, 0.0, 0.0]
    transform: FIXED
    pitch-follow: false
    spin: 90
    orbit: true
    # 环绕半径要比"手臂外沿到轴线的距离"再大出半尺寸：
    # 护臂外沿 |right|=0.53、前后 0.18，合起来约 0.56；半尺寸 0.17。
    # 半径 0.60 时内圈只有 0.52，转过来就切进手臂里 —— 抬到 0.78 内圈 0.61 才够。
    orbit-radius: 0.78

# 属性透传：装饰槽里的物品，其 attribute_modifiers 是否生效
attributes:
  # true = 把槽内物品的属性修饰符施加到玩家身上（取下即失效）
  enabled: true
  # true = 只接受这些 Attribute（空列表 = 全部接受）
  # 例：只让护甲值与最大生命生效 -> [ARMOR, MAX_HEALTH]
  whitelist: []
  # 这些 Attribute 永不透传（防止装饰品变成外挂）
  blacklist:
    - MAX_HEALTH
  # 同一种属性被多个槽同时提供时：true = 叠加，false = 只取绝对值最大的那个
  stack: true

# 装饰槽里的物品不能被"使用"：吃掉、倒出来、放成方块
block-use:
  consume: true
  block-place: true
  interact: true

# 界面
gui:
  title: "&8装备外观"
  # 部位在界面里的位置（0-53，54 格箱子）
  rows: 6
  slot-index:
    head: 10
    shoulder: 12
    back: 14
    waist: 16
    orbit: 22
  info-index: 4
  clear-index: 49
  close-index: 53
