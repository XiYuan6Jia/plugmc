config-version: 15
menu:
  title: "&8服务器菜单"
  rows: 6
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  items:
    # 头部信息
    "4":
      material: NETHER_STAR
      name: "&6&l服务器菜单"
      lore:
        - "&7欢迎，&f{player}"
        - "&7余额：&e{balance}"
        - "&7签到：&f{daily_status}"
        - "&7状态：{frozen_status}"
      action: none

    # 第一区：我的
    "11":
      material: GOLD_INGOT
      name: "&6我的余额"
      lore:
        - "&7当前余额：&e{balance}"
        - "&7账户状态：{frozen_status}"
        - "&8点击查看"
      action: balance
    "13":
      material: SUNFLOWER
      name: "&e每日签到"
      lore:
        - "&7状态：&f{daily_status}"
        - "&7连签奖励逐日递增"
        - "&8点击签到"
      action: daily
      permission: economy.reward.daily
    "15":
      material: PAPER
      name: "&f邮箱"
      lore:
        - "&7领取市场/交易退回的物品"
        - "&8点击打开"
      action: player_command
      value: "mail"
      permission: economy.mail.use
    "20":
      material: CLOCK
      name: "&a金币 HUD：{hud_status}"
      lore:
        - "&7在屏幕右侧显示当前余额"
        - "&8点击切换"
      action: toggle_hud
    "22":
      material: GOLD_BLOCK
      name: "&6余额排行"
      lore:
        - "&7查看服务器富豪榜"
        - "&8点击打开"
      action: player_command
      value: "baltop"
      permission: economy.balance.top
    "24":
      material: LEATHER_CHESTPLATE
      name: "&d装备外观"
      lore:
        - "&7把任意物品挂到头顶、肩侧、背后、腰间或环绕"
        - "&7随时能取下，物品原样回到背包"
        - "&8点击打开外观界面"
      action: cosmetic_panel

    # 第二区：交易
    "28":
      material: CHEST
      name: "&6系统商店"
      lore:
        - "&7官方定价买卖基础物资"
        - "&8点击打开"
      action: player_command
      value: "shop"
      permission: economy.shop.use
    "30":
      material: EMERALD
      name: "&a玩家市场"
      lore:
        - "&7玩家之间挂单买卖"
        - "&8点击打开"
      action: player_command
      value: "market"
      permission: economy.market.use
    "32":
      material: GOLDEN_CHESTPLATE
      name: "&e拍卖行"
      lore:
        - "&7竞价与一口价拍卖"
        - "&8点击打开"
      action: player_command
      value: "auction"
      permission: economy.auction.use
    "34":
      material: HOPPER
      name: "&b收购订单"
      lore:
        - "&7发布求购，等待其他玩家交付"
        - "&8点击打开"
      action: player_command
      value: "order"
      permission: economy.order.use
    "40":
      material: BRICKS
      name: "&6建材银行"
      lore:
        - "&7存入建材换算额度，兑换同类建材"
        - "&7购买建材时可抵扣金币"
        - "&8点击打开"
      action: player_command
      value: "bank"
      permission: economy.bank.use
    "42":
      material: CHEST
      name: "&6回收箱"
      lore:
        - "&7把箱子或木桶变成自动结算的容器"
        - "&7别人往里放的物品会换成金币与建材额度"
        - "&8点击查看怎么用"
      action: vault_panel
      permission: economy.vault.use
    "44":
      material: SADDLE
      name: "&b玩家骑乘"
      lore:
        - "&7骑到其他玩家身上兜风"
        - "&7潜行或 &f/ride off &7下来"
        - "&8暂时只开放给 OP"
      action: player_command
      value: "ride"
      permission: ride.use

    # 第三区：社交与信息
    "36":
      material: COMPASS
      name: "&a主城大厅"
      lore:
        - "&7独立虚空主城，安全无怪"
        - "&8点击打开大厅子页"
      action: hub_panel
      permission: hub.use
    "38":
      material: LEVER
      name: "&d小游戏"
      lore:
        - "&721点 / 幸运转盘 / 老虎机"
        - "&8主城北侧有实体店，点击打开菜单"
      action: player_command
      value: "games"
      permission: minigames.use
    "39":
      material: PLAYER_HEAD
      name: "&d直接交易"
      lore:
        - "&7与其他玩家面对面交换物品"
        - "&8点击选择在线玩家"
      action: player_command
      value: "trade"
      permission: economy.trade.use
    "37":
      material: ENDER_PEARL
      name: "&b申请传送"
      lore:
        - "&7点击在线玩家头像发送传送申请"
        - "&8对方可在聊天栏一键接受"
      action: player_command
      value: "tpa"
      permission: tpa.use
    "41":
      material: BOOKSHELF
      name: "&b插件列表"
      lore:
        - "&7查看已启用插件的功能和用法"
        - "&8点击浏览"
      action: plugin_list
    "43":
      material: BOOK
      name: "&b服务器帮助"
      lore:
        - "&7常用经济命令一览"
        - "&8点击查看"
      action: message
      value: "&e/money &7余额  &e/shop &7商店  &e/market &7市场  &e/auction &7拍卖  &e/order &7收购  &e/mail &7邮箱  &e/daily &7签到"

    # 底部：管理与关闭
    "48":
      material: COMPARATOR
      name: "&c经济管理"
      lore:
        - "&7统计、自检、财政与冻结"
        - "&8仅管理员可见"
      action: economy_admin
      permission: server-menu.admin
    "50":
      material: BARRIER
      name: "&c关闭菜单"
      action: close
hud:
  enabled-by-default: true
  title: "&6&l经济"
  balance-label: "&7余额"
