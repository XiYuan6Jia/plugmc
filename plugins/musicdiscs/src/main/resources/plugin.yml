name: musicdiscs
version: '${version}'
main: com.xiyuan.plugmc.musicdiscs.MusicPlugin
api-version: '${api_version}'
authors: [XiYuan6Jia]
description: "自定义唱片：上传 ogg 生成资源包与唱片物品，插件播放并可导出 jukebox_song 数据包"
commands:
  music:
    description: "自定义唱片：列表、试听、领取、导入、导出数据包"
    usage: /music [list|play <ID>|stop|give [玩家] <ID>|import <ID> [标题] [作者]|info <ID>|delete <ID>|pack [玩家]|export|reload]
    aliases: [disc, juke, record]
permissions:
  music.use:
    description: "试听与使用自定义唱片"
    default: true
  music.give:
    description: "领取自定义唱片物品"
    default: op
  music.admin:
    description: "导入/删除唱片、导出数据包、下发资源包"
    default: op
