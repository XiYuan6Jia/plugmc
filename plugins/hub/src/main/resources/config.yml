# 主城大厅（独立虚空维度 + 插件生成的大厅建筑）
world:
  # 世界（维度）文件夹名，创建后不建议改名
  name: hub
  # 地板方块所在的 Y 层，出生点在该层上方一格
  floor-y: 64
  # 大厅半径（实际宽度 = 2 × radius + 1），范围 8-48
  radius: 24
  # 启动时如果大厅不存在则自动生成
  auto-build: true

spawn:
  x: 0.5
  y: 65.0
  z: 8.5
  yaw: 180.0
  pitch: 0.0

# 大厅里的两行悬浮文字
text:
  title: "&6&l主城大厅"
  subtitle: "&7/menu 打开菜单 · &f/hub back &7返回原位置"

teleport:
  # 进服时把玩家送进主城（默认关闭：用 /hub 或菜单进入）
  join-auto: false
  # /hub 进入主城的读秒（秒），期间移动或受伤会取消；0 表示立即传送
  warmup-seconds: 3
  # 在主城死亡时原地（主城出生点）重生
  respawn-in-hub: true
  # 掉出世界底部（Y < 0）时拉回出生点
  rescue-void: true

protect:
  deny-build: true
  deny-pvp: true
  deny-mob-spawn: true
  no-fall-damage: true
  # 主城维度难度。不要用 PEACEFUL：和平难度会自动补满饱食度并持续回血
  difficulty: NORMAL
  # 冻结主城内的饱食度：不掉饿也不会自动补满，吃东西仍可恢复
  lock-food: true
  # 冻结主城内的血量：进入时的血量保持不变，伤害会被拉回，也不会自然回血
  lock-health: true
  # 关闭主城内的回血（饥饿/饱和/和平难度/药水），药水效果本身仍可正常结算
  no-natural-regen: true

# 主城东侧出口外的跑酷赛道
parkour:
  enabled: true
  # 有人刷新纪录时全服播报
  announce-records: true
